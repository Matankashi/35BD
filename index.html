/* ---------------- STATE ---------------- */
let STATE={checks:{},guests:{},expenses:[],shopCustom:[],shopDeleted:{}};
const STORE_KEY='state';

async function loadState(){
  // seed defaults (only used when no saved state exists)
  GUESTS.forEach((g,i)=>{STATE.guests[g.id]={name:g.name,note:g.note||'',paid:!!g.paid,amount:g.amount||120,count:g.count||1,ts:i};});
  try{
    const r=await window.storage.get(STORE_KEY);
    if(r&&r.value){
      const saved=JSON.parse(r.value);
      STATE.checks=saved.checks||{};
      if(saved.guests){
        STATE.guests=saved.guests;
        // migration: if old format missing name, restore from seed
        GUESTS.forEach((g,i)=>{
          if(STATE.guests[g.id]){
            if(!STATE.guests[g.id].name)STATE.guests[g.id].name=g.name;
            if(!STATE.guests[g.id].note)STATE.guests[g.id].note=g.note||'';
            if(STATE.guests[g.id].ts===undefined)STATE.guests[g.id].ts=i;
            if(STATE.guests[g.id].count===undefined&&g.count)STATE.guests[g.id].count=g.count;
          }
        });
      }
      if(saved.expenses)STATE.expenses=saved.expenses;
      if(saved.shopCustom)STATE.shopCustom=saved.shopCustom;
      if(saved.shopDeleted)STATE.shopDeleted=saved.shopDeleted;
    }
  }catch(e){/* first run */}
}
let saveTimer=null;
async function saveState(){
  try{await window.storage.set(STORE_KEY,JSON.stringify(STATE));toast();}
  catch(e){}
}
function toast(){const s=document.getElementById('saved');s.classList.add('show');clearTimeout(saveTimer);saveTimer=setTimeout(()=>s.classList.remove('show'),900);}

/* ---------------- HELPERS ---------------- */
function allItemsOf(tab){
  const out=[];(DATA[tab]||[]).forEach(sec=>{if(sec.items)sec.items.forEach(i=>out.push(i));});return out;
}
function progressOf(tab){
  let items=allItemsOf(tab);
  if(tab==='shop'){
    items=items.filter(i=>!STATE.shopDeleted[i.id]);
    (STATE.shopCustom||[]).forEach(i=>items.push({id:i.id}));
  }
  if(!items.length)return{done:0,total:0,pct:0};
  const done=items.filter(i=>STATE.checks[i.id]).length;
  return{done,total:items.length,pct:Math.round(done/items.length*100)};
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---------------- RENDER: tabs ---------------- */
const tabsEl=document.getElementById('tabs');
const panelsEl=document.getElementById('panels');
let activeTab='dash';

function renderTabs(){
  tabsEl.innerHTML='';
  TABS.forEach(t=>{
    const b=document.createElement('button');
    b.className='tab'+(t.id===activeTab?' active':'');
    let cnt='';
    if(DATA[t.id]){const p=progressOf(t.id);cnt=`<span class="cnt">${p.done}/${p.total}</span>`;}
    if(t.id==='guests'){const gs=Object.values(STATE.guests);const total=gs.reduce((s,g)=>s+(g.count||1),0);const paid=gs.reduce((s,g)=>s+(g.paid?(g.count||1):0),0);cnt=`<span class="cnt">${paid}/${total}</span>`;}
    if(t.id==='expenses'){cnt=`<span class="cnt">${STATE.expenses.length}</span>`;}
    b.innerHTML=`${t.icon} ${t.name}${cnt}`;
    b.onclick=()=>{activeTab=t.id;render();};
    tabsEl.appendChild(b);
  });
}

/* ---------------- RENDER: checklist panel ---------------- */
function checklistHTML(tab){
  let h='';
  (DATA[tab]||[]).forEach(sec=>{
    if(sec.info){
      h+=`<div class="card"><div class="info"><div class="it">✔️ ${esc(sec.info)}</div><div class="chips">${sec.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div></div></div>`;
      return;
    }
    h+=`<div class="card sect"><div class="sect-head">${esc(sec.h)}</div><ul class="list">`;
    sec.items.forEach(i=>{
      const on=STATE.checks[i.id]?' on':'';
      h+=`<li class="item${on}" data-id="${i.id}">
        <span class="box">✓</span>
        <span class="txt">${esc(i.t)}${i.q?`<span class="qty">${esc(i.q)}</span>`:''}${i.n?`<span class="note">${esc(i.n)}</span>`:''}</span>
      </li>`;
    });
    h+=`</ul></div>`;
  });
  return h;
}

      <h3><span class="h-ic">💰</span> כספים</h3>
      <p class="desc">120₪ לאדם · גיא 50₪ · הפייבוקס פתוח</p>
      <div class="prog-row" style="cursor:default"><span class="pname">צפי גבייה</span><span class="amt" style="font-family:'Frank Ruhl Libre';font-weight:700;color:var(--amber);font-size:18px">${expected.toLocaleString()}₪</span></div>
      <div class="prog-row" style="cursor:default"><span class="pname">נגבה עד כה</span><span style="font-family:'Frank Ruhl Libre';font-weight:700;color:var(--paid);font-size:18px">${collected.toLocaleString()}₪</span></div>
      <div class="prog-row" style="cursor:default"><span class="pname">נותר לגבות</span><span style="font-family:'Frank Ruhl Libre';font-weight:700;color:var(--red);font-size:18px">${outstanding.toLocaleString()}₪</span></div>
      <div class="prog-row" style="cursor:default"><span class="pname">סך הוצאות</span><span style="font-family:'Frank Ruhl Libre';font-weight:700;color:var(--ember2);font-size:18px">${spent.toLocaleString()}₪</span></div>
      <div class="prog-row" data-go="expenses"><span class="pname">יתרה (נגבה − הוצאות)</span><span style="font-family:'Frank Ruhl Libre';font-weight:700;color:${balance>=0?'var(--paid)':'var(--red)'};font-size:18px">${balance.toLocaleString()}₪</span></div>
      <div class="bar" style="margin-top:8px"><i class="${collected>=expected?'done':''}" style="width:${expected?Math.round(collected/expected*100):0}%"></i></div>
    </div>

    <div class="card">
      <h3><span class="h-ic">📋</span> התקדמות לפי קטגוריה</h3>
      <p class="desc">לחיצה על שורה עוברת לרשימה</p>
      ${prog}
    </div>
  </div>`;
}

/* ---------------- RENDER: guests ---------------- */
function guestsHTML(){
  const gList=Object.entries(STATE.guests).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0));
  const totalPeople=gList.reduce((s,[,g])=>s+(g.count||1),0);
  const expected=gList.reduce((s,[,g])=>s+(+g.amount||0),0);
  const collected=gList.reduce((s,[,g])=>s+(g.paid?(+g.amount||0):0),0);
  let rows='';
  gList.forEach(([id,g])=>{
    const m=g.method||'';
    const cnt=g.count||1;
    const meths=['paybox','bit','cash'];
    const methLabels={paybox:'Paybox',bit:'Bit',cash:'מזומן'};
    const methBtns=meths.map(k=>`<button class="meth-btn${m===k?' meth-on':''}" data-gid="${id}" data-m="${k}">${methLabels[k]}</button>`).join('');
    rows+=`<div class="guest guest-card${g.paid?' paid':''}" data-gid="${id}">
      <div class="guest-main">
        <button class="toggle">${g.paid?'שולם ✓':'לא שולם'}</button>
        <div class="gname">${esc(g.name)}${g.note?`<small>${esc(g.note)}</small>`:''}</div>
        <button class="g-del" data-gid="${id}">✕</button>
      </div>
      <div class="guest-sub">
        <button class="g-count" data-gid="${id}" title="מספר אנשים — לחץ לשינוי">×${cnt}</button>
        <input class="g-amt" type="number" inputmode="decimal" value="${+g.amount}" data-gid="${id}" min="0">
        <span class="g-sym">₪</span>
        <div class="methods">${methBtns}</div>
      </div>
    </div>`;
  });
  return `
  <div class="gtotal">
    <div class="stat"><div class="lab">סה״כ משתתפים</div><div class="big" style="font-size:30px">${totalPeople}</div><div class="foot">${gList.length} רשומות</div></div>
    <div class="stat"><div class="lab">נגבה</div><div class="big" style="font-size:30px;color:var(--paid)">${collected.toLocaleString()}₪</div></div>
    <div class="stat"><div class="lab">נותר לגבות</div><div class="big" style="font-size:30px;color:var(--ember2)">${(expected-collected).toLocaleString()}₪</div></div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <h3><span class="h-ic">➕</span> הוספת אורח</h3>
    <p class="desc">שם + סכום. הערה — אופציונלי.</p>
    <div class="exp-add">
      <input id="gName" class="exp-in" type="text" placeholder="שם">
      <input id="gNote" class="exp-in" type="text" placeholder="הערה (אופציונלי)" style="flex:0.8">
      <input id="gAmt" class="exp-in amt-in" type="number" inputmode="decimal" placeholder="₪ סכום" value="120">
      <button id="gAdd" class="exp-btn">הוסף</button>
    </div>
  </div>
  <div class="card">
    <h3><span class="h-ic">👥</span> רשימת מוזמנים · ${totalPeople} משתתפים</h3>
    <p class="desc">שולם/לא שולם · ×N מספר אנשים · ערוך סכום · בחר אמצעי תשלום · ✕ להסיר</p>
    ${rows}
    <div class="tip">לחץ על ×N כדי לשנות את מספר האנשים ברשומה.</div>
  </div>`;
}

/* ---------------- RENDER: expenses ---------------- */
function expensesHTML(){
  const total=STATE.expenses.reduce((s,e)=>s+(+e.amount||0),0);
  const collected=Object.values(STATE.guests).reduce((s,g)=>s+(g.paid?(+g.amount||0):0),0);
  const balance=collected-total;
  let rows='';
  if(!STATE.expenses.length){
    rows=`<div style="color:var(--faint);text-align:center;padding:20px;font-size:14px">עדיין לא הוזנו הוצאות — הוסף את הראשונה למעלה</div>`;
  }else{
    STATE.expenses.slice().reverse().forEach(e=>{
      rows+=`<div class="guest" data-eid="${e.id}">
        <button class="toggle del">מחק ✕</button>
        <div class="gname">${esc(e.desc)}</div>
        <div class="amt">${(+e.amount).toLocaleString()}₪</div>
      </div>`;
    });
  }
  return `
  <div class="gtotal">
    <div class="stat"><div class="lab">סך הוצאות</div><div class="big" style="font-size:30px;color:var(--ember2)">${total.toLocaleString()}₪</div></div>
    <div class="stat"><div class="lab">נגבה מאורחים</div><div class="big" style="font-size:30px;color:var(--paid)">${collected.toLocaleString()}₪</div></div>
    <div class="stat"><div class="lab">יתרה</div><div class="big" style="font-size:30px;color:${balance>=0?'var(--paid)':'var(--red)'}">${balance.toLocaleString()}₪</div></div>
  </div>
  <div class="card">
    <h3><span class="h-ic">🧾</span> הוספת הוצאה</h3>
    <p class="desc">תיאור + סכום. לדוגמה: "בשר מהקצב" · 540</p>
    <div class="exp-add">
      <input id="expDesc" class="exp-in" type="text" placeholder="תיאור ההוצאה">
      <input id="expAmt" class="exp-in amt-in" type="number" inputmode="decimal" placeholder="₪ סכום">
      <button id="expAdd" class="exp-btn">הוסף</button>
    </div>
  </div>
  <div class="card">
    <h3><span class="h-ic">📒</span> רשימת הוצאות</h3>
    ${rows}
  </div>`;
}

/* ---------------- RENDER: shop ---------------- */
function shopHTML(){
  const custom=STATE.shopCustom||[];
  let h='';
  h+=`<div class="card" style="margin-bottom:14px">
    <h3><span class="h-ic">➕</span> הוספת פריט לקנייה</h3>
    <div class="exp-add">
      <input id="shopName" class="exp-in" type="text" placeholder="שם הפריט">
      <input id="shopQty" class="exp-in" type="text" placeholder="כמות (אופציונלי)" style="flex:0.7;min-width:110px">
      <button id="shopAdd" class="exp-btn">הוסף</button>
    </div>
  </div>`;
  if(custom.length){
    h+=`<div class="card sect" style="margin-bottom:14px"><div class="sect-head">➕ הוספות אישיות</div><ul class="list">`;
    custom.forEach(i=>{
      const on=STATE.checks[i.id]?' on':'';
      h+=`<li class="item${on}" data-id="${i.id}">
        <span class="box">✓</span>
        <span class="txt">${esc(i.name)}${i.qty?`<span class="qty">${esc(i.qty)}</span>`:''}</span>
        <button class="item-del" data-cid="${i.id}">✕</button>
      </li>`;
    });
    h+=`</ul></div>`;
  }
  DATA.shop.forEach(sec=>{
    if(sec.info){
      h+=`<div class="card"><div class="info"><div class="it">✔️ ${esc(sec.info)}</div><div class="chips">${sec.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div></div></div>`;
      return;
    }
    const visible=sec.items.filter(i=>!STATE.shopDeleted[i.id]);
    if(!visible.length)return;
    h+=`<div class="card sect"><div class="sect-head">${esc(sec.h)}</div><ul class="list">`;
    visible.forEach(i=>{
      const on=STATE.checks[i.id]?' on':'';
      h+=`<li class="item${on}" data-id="${i.id}">
        <span class="box">✓</span>
        <span class="txt">${esc(i.t)}${i.q?`<span class="qty">${esc(i.q)}</span>`:''}${i.n?`<span class="note">${esc(i.n)}</span>`:''}</span>
        <button class="item-del" data-did="${i.id}">✕</button>
      </li>`;
    });
    h+=`</ul></div>`;
  });
  return h;
}

/* ---------------- RENDER: schedule ---------------- */
function scheduleHTML(){
  const sections=[
    {icon:'🙌',name:'פתיחה',items:[
      'התכנסות והתמקמות החל מ־14:00',
      'מוזיקה, בירות קרות ונשנושים',
      'הרמת כוסית בתחילת האירוע',
      'כמה מילים קצרות ממך ופתיחה רשמית של יום ההולדת',
    ]},
    {icon:'🍖',name:'אוכל ושתייה',items:[
      'פתיחת שולחן עם פיתות, חומוס, טחינה, סלטים וחמוצים',
      'הדלקת המנגל ב־15:00',
      'סבב ראשון של בשרים: כנפיים, מרגז, צ׳וריסוס וקבבים',
      'סבב שני: פרגיות ונתח בקר איכותי',
      'אפרול שפריץ, אוזו לימונים, יין, וויסקי ושתייה קלה',
      'עוגה, נרות וברכות',
    ]},
    {icon:'🎯',name:'משחקים ופעילויות',items:[
      'משחק הכר את הקאש',
      'פריזבי',
      'כדורגל',
      'ערסל וישיבה חופשית על המחצלות',
      'מוזיקה, שיחות וצחוקים',
    ]},
    {icon:'📸',name:'תמונות וזיכרונות',items:[
      'צילום תמונות וסרטונים במהלך האירוע',
      'העלאת התמונות לקבוצת הוואטסאפ כדי ליצור אלבום משותף',
    ]},
  ];
  const timeline=[
    {time:'14:00',label:'התכנסות, מוזיקה ובירות'},
    {time:'14:30',label:'הרמת כוסית'},
    {time:'15:00',label:'הדלקת המנגל'},
    {time:'15:30',label:'משחק הכר את הקאש'},
    {time:'בהמשך',label:'פריזבי, כדורגל, אוכל חופשי ועוגה לקראת הסוף'},
  ];
  let h=`<div class="card" style="margin-bottom:14px">
    <h3><span class="h-ic">⏰</span> סדר מומלץ</h3>
    <p class="desc">תוכנית הפעולה המומלצת ליום</p>`;
  timeline.forEach((t,i)=>{
    const last=i===timeline.length-1;
    h+=`<div class="tl-grid${last?' tl-last':''}">
      <div class="tl-time">${esc(t.time)}</div>
      <div class="tl-col"><div class="tl-dot"></div><div class="tl-line"></div></div>
      <div class="tl-label">${esc(t.label)}</div>
    </div>`;
  });
  h+=`</div>`;
  let n=1;
  sections.forEach(sec=>{
    h+=`<div class="card sched-sec">
      <h3><span class="h-ic">${sec.icon}</span> ${esc(sec.name)}</h3>
      <ul class="sched-list">`;
    sec.items.forEach(item=>{
      h+=`<li class="sched-item"><span class="sched-num">${n++}</span><span class="sched-txt">${esc(item)}</span></li>`;
    });
    h+=`</ul></div>`;
  });
  return h;
}

/* ---------------- MAIN RENDER ---------------- */
function render(){
  renderTabs();
  let html='';
  if(activeTab==='dash') html=dashboardHTML();
  else if(activeTab==='sched') html=scheduleHTML();
  else if(activeTab==='guests') html=guestsHTML();
  else if(activeTab==='expenses') html=expensesHTML();
  else if(activeTab==='shop') html=`<div class="grid">${shopHTML()}</div>`;
  else html=`<div class="grid">${checklistHTML(activeTab)}</div>`;
  panelsEl.innerHTML=`<div class="panel active">${html}</div>`;
  bindPanel();
}

function bindPanel(){
  panelsEl.querySelectorAll('li.item').forEach(li=>{
    li.onclick=()=>{
      const id=li.dataset.id;
      STATE.checks[id]=!STATE.checks[id];
      li.classList.toggle('on',STATE.checks[id]);
      renderTabs();
      saveState();
    };
  });
  panelsEl.querySelectorAll('[data-go]').forEach(row=>{
    row.onclick=()=>{activeTab=row.dataset.go;render();window.scrollTo({top:0,behavior:'smooth'});};
  });
  // guest: toggle paid
  panelsEl.querySelectorAll('.guest[data-gid]').forEach(g=>{
    g.querySelector('.toggle').onclick=()=>{
      const id=g.dataset.gid;
      STATE.guests[id].paid=!STATE.guests[id].paid;
      saveState();render();
    };
  });
  // guest: edit amount
  panelsEl.querySelectorAll('.g-amt').forEach(inp=>{
    const save=()=>{
      const val=parseFloat(inp.value);
      if(!isNaN(val)&&val>=0){STATE.guests[inp.dataset.gid].amount=val;saveState();}
    };
    inp.addEventListener('change',save);
    inp.addEventListener('blur',save);
    inp.addEventListener('click',e=>e.stopPropagation());
  });
  // guest: count toggle
  panelsEl.querySelectorAll('.g-count').forEach(b=>{
    b.onclick=(e)=>{
      e.stopPropagation();
      const id=b.dataset.gid;
      const cur=STATE.guests[id].count||1;
      STATE.guests[id].count=cur>=4?1:cur+1;
      saveState();render();
    };
  });
  // guest: payment method
  panelsEl.querySelectorAll('.meth-btn').forEach(b=>{
    b.onclick=(e)=>{
      e.stopPropagation();
      const id=b.dataset.gid;const m=b.dataset.m;
      STATE.guests[id].method=(STATE.guests[id].method===m?'':m);
      saveState();render();
    };
  });
  // add guest
  const gAddBtn=panelsEl.querySelector('#gAdd');
  if(gAddBtn){
    const doAddGuest=()=>{
      const nEl=panelsEl.querySelector('#gName');
      const noteEl=panelsEl.querySelector('#gNote');
      const aEl=panelsEl.querySelector('#gAmt');
      const name=nEl.value.trim();
      const amt=parseFloat(aEl.value);
      if(!name){nEl.focus();return;}
      if(isNaN(amt)||amt<0){aEl.focus();return;}
      const id='g'+Date.now();
      STATE.guests[id]={name,note:noteEl.value.trim(),paid:false,amount:amt,ts:Date.now()};
      saveState();render();
    };
    gAddBtn.onclick=doAddGuest;
    panelsEl.querySelector('#gName').addEventListener('keydown',ev=>{if(ev.key==='Enter')panelsEl.querySelector('#gAmt').focus();});
    panelsEl.querySelector('#gAmt').addEventListener('keydown',ev=>{if(ev.key==='Enter')doAddGuest();});
  }
  // shop: add item
  const shopAddBtn=panelsEl.querySelector('#shopAdd');
  if(shopAddBtn){
    const doAddShop=()=>{
      const nEl=panelsEl.querySelector('#shopName');
      const qEl=panelsEl.querySelector('#shopQty');
      const name=nEl.value.trim();
      if(!name){nEl.focus();return;}
      const id='sc'+Date.now();
      STATE.shopCustom.push({id,name,qty:qEl.value.trim(),ts:Date.now()});
      saveState();render();
    };
    shopAddBtn.onclick=doAddShop;
    panelsEl.querySelector('#shopName').addEventListener('keydown',ev=>{if(ev.key==='Enter')doAddShop();});
  }
  // shop: delete custom item
  panelsEl.querySelectorAll('.item-del[data-cid]').forEach(b=>{
    b.onclick=(e)=>{
      e.stopPropagation();
      const id=b.dataset.cid;
      STATE.shopCustom=STATE.shopCustom.filter(i=>i.id!==id);
      delete STATE.checks[id];
      saveState();render();
    };
  });
  // shop: delete hardcoded item
  panelsEl.querySelectorAll('.item-del[data-did]').forEach(b=>{
    b.onclick=(e)=>{
      e.stopPropagation();
      STATE.shopDeleted[b.dataset.did]=true;
      saveState();render();
    };
  });
  // delete guest
  panelsEl.querySelectorAll('.g-del').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.gid;
      if(confirm(`להסיר את ${STATE.guests[id]?.name}?`)){
        delete STATE.guests[id];saveState();render();
      }
    };
  });
  const addBtn=panelsEl.querySelector('#expAdd');
  if(addBtn){
    const doAdd=()=>{
      const dEl=panelsEl.querySelector('#expDesc');
      const aEl=panelsEl.querySelector('#expAmt');
      const desc=dEl.value.trim();
      const amt=parseFloat(aEl.value);
      if(!desc){dEl.focus();return;}
      if(isNaN(amt)){aEl.focus();return;}
      STATE.expenses.push({id:'e'+Date.now(),desc,amount:amt});
      saveState();render();
    };
    addBtn.onclick=doAdd;
    panelsEl.querySelector('#expAmt').addEventListener('keydown',ev=>{if(ev.key==='Enter')doAdd();});
    panelsEl.querySelector('#expDesc').addEventListener('keydown',ev=>{if(ev.key==='Enter')panelsEl.querySelector('#expAmt').focus();});
  }
  panelsEl.querySelectorAll('.guest[data-eid] .del').forEach(b=>{
    b.onclick=()=>{
      const id=b.closest('.guest').dataset.eid;
      STATE.expenses=STATE.expenses.filter(e=>e.id!==id);
      saveState();render();
    };
  });
}

document.getElementById('resetBtn').onclick=()=>{
  if(confirm('לאפס את כל הסימונים? התשלומים יישארו.')){
    STATE.checks={};saveState();render();
  }
};

setInterval(()=>{if(activeTab==='dash')render();},60000);

(async()=>{await loadState();render();})();
</script>
</body>
</html>
